<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision Tracker</title>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <h1>Spaced Repetition Tracker</h1>

    <label for="users">Select a user:</label>
    <select id="users">
    </select>

    <h2>Revision Agenda</h2>

    <p id="agenda-message" aria-live="polite"></p>

    <ul id="agenda-list"></ul>
    <button type="button" id="clear-agenda">Clear my agenda</button>

    <h2>Add a Revision Topic</h2>

<form id="revision-form">
  <label for="topic">Topic:</label>
  <input type="text" id="topic" name="topic" required>

  <label for="revision-date">Revision date:</label>
  <input type="date" id="revision-date" name="revision-date" required>

  <button type="submit">Add Topic</button>
</form> 
  </body>
</html>
